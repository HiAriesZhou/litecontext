name: Verify CLI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PR updates supersede older checks; each main push has its own group, including
# pending runs (cancel-in-progress: false alone would still replace pending runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-history:
    name: Secret history
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists the pull request's commits on pull_request events.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-verify:
    name: Go verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go test ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go vet ./...
      - name: Build and smoke
        if: runner.os == 'Windows'
        run: |
          go build -o "$env:RUNNER_TEMP\lc.exe" ./cmd/litecontext
          & "$env:RUNNER_TEMP\lc.exe" version --json
      - name: Build and smoke
        if: runner.os != 'Windows'
        run: |
          go build -o "${RUNNER_TEMP}/lc" ./cmd/litecontext
          "${RUNNER_TEMP}/lc" version --json
      - run: git diff --check

  desktop-verify:
    name: macOS desktop build
    runs-on: macos-15
    env:
      # tauri build exports bundle.macOS.minimumSystemVersion; without the same
      # value the Rust tests compile the native dependencies a second time.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Select Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri -> target
          cache-bin: false
      # npm installs the locked, precompiled Tauri CLI; do not cargo-install it.
      - run: npm ci
      - run: npm test
      - run: npm run core
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # Match the app build's feature graph so dependencies need compiling once.
      - run: cargo test --release --locked --features custom-protocol --manifest-path src-tauri/Cargo.toml
      - run: npm run build
      - name: Packaged core smoke
        run: ./src-tauri/target/release/bundle/macos/LiteContext.app/Contents/MacOS/lc version --json
      - run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - run: git diff --check
