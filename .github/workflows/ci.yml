name: Verify CLI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-history:
    name: Secret history
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists the pull request's commits on pull_request events.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-verify:
    name: Go verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go test ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go vet ./...
      - name: Build and smoke
        if: runner.os == 'Windows'
        run: |
          go build -o "$env:RUNNER_TEMP\lc.exe" ./cmd/litecontext
          & "$env:RUNNER_TEMP\lc.exe" version --json
      - name: Build and smoke
        if: runner.os != 'Windows'
        run: |
          go build -o "${RUNNER_TEMP}/lc" ./cmd/litecontext
          "${RUNNER_TEMP}/lc" version --json
      - run: git diff --check

  desktop-verify:
    name: macOS desktop build
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run core
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run build
      - name: Packaged core smoke
        run: ./src-tauri/target/release/bundle/macos/LiteContext.app/Contents/MacOS/lc version --json
      - run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - run: git diff --check
