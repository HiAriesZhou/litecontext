<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiteContext</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">跳到内容</a>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">L</span><strong>LiteContext</strong></div>
      <div class="workspace-label">工作空间</div>
      <div id="bundle-name" class="bundle-name">尚未选择</div>
      <button id="choose" class="button secondary">选择 bundle<span class="shortcut" aria-hidden="true">⌘ O</span></button>
      <nav aria-label="信息分类">
        <button data-section="sources" aria-current="page"><span>来源</span><span class="count" id="count-sources">—</span></button>
        <button data-section="memories"><span>记忆</span><span class="count" id="count-memories">—</span></button>
        <button data-section="task"><span>任务</span><span class="count" id="count-task">—</span></button>
        <button data-section="deliveries"><span>交付记录</span><span class="count" id="count-deliveries">—</span></button>
      </nav>
      <div class="sidebar-footer"><span class="local-dot" aria-hidden="true"></span>本机工作台<div>本机保存 · 证据可查</div></div>
    </aside>
    <main>
      <header class="toolbar">
        <div><div class="eyebrow">信息底座</div><h1 id="section-title">来源</h1></div>
        <button id="refresh" class="button secondary" disabled>刷新<span class="shortcut" aria-hidden="true">⌘ R</span></button>
      </header>
      <div class="context-line"><span id="freshness">选择一个 bundle，查看实际保存的信息。</span><span id="timing"></span></div>
      <div id="status" role="status" aria-live="polite"></div>
      <div id="error" role="alert" hidden></div>
      <div id="warnings" hidden></div>
      <section id="content" aria-labelledby="section-title" tabindex="-1"></section>
      <footer class="workspace-footer"><span id="bundle-path">尚未读取任何数据</span><span id="generation"></span></footer>
    </main>
  </div>
</body>
</html>
